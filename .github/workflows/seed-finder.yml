name: Run Seed Finder Overnight

# The workflow_dispatch trigger creates a manual "Run" button in the GitHub UI
on:
  workflow_dispatch: 

jobs:
  find-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Headless Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install Project Dependencies
        run: npm install

      - name: Execute Seed Finder
        env:
          CHROMIUM_PATH: /usr/bin/chromium-browser
        run: |
          npm run find-seeds -- \
            --prefix arena-overnight \
            --count 20000 \
            --workers 2 \
            --batch-size 25 \
            --top 50 \
            --selected-limit 30 \
            --output arena-overnight-10000.json

      - name: Upload JSON Results
        # This step guarantees the JSON file is saved and downloadable even if you close the tab
        uses: actions/upload-artifact@v4
        with:
          name: seed-results
          path: arena-overnight-10000.json