name: Run Seed Finder

on:
  workflow_dispatch: 

jobs:
  find-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        env:
          # Bypasses a massive, unnecessary Chromium download since we use the pre-installed Chrome
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm install

      - name: Execute Seed Finder
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        # The '>' operator safely folds this into a single command, eliminating fragile backslashes
        run: >
          timeout 350m
          npm run find-seeds --
          --prefix A
          --count 10000
          --workers 2
          --batch-size 25
          --top 50
          --selected-limit 30
          --output arena-seed-finder-10000.json

      - name: Upload JSON Results
        # Forces the upload to execute even if the step above times out or fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-results
          path: arena-seed-finder-10000.json
